<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found · Mahdiyar Zerehpoush</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304050B'/%3E%3Ccircle cx='32' cy='38' r='17' fill='%2310112A' stroke='%238C80FF' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Served for any missing path, so everything stays inline and links are absolute. */
  :root{
    --bg:#04050B;
    --indigo-soft:#8C80FF;
    --t-hi:#E9E9F2;
    --t-mut:#6E7191;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 70% at 50% 115%, #0C0D1A 0%, var(--bg) 62%);
    color:var(--t-hi);
    font-family:'Jost', 'Futura', 'Avenir Next', 'Segoe UI', sans-serif;
    min-height:100vh;min-height:100svh;
    display:grid;place-items:center;overflow-x:hidden;
  }
  main{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 20px}
  .eclipse{
    --size:min(230px,56vw);
    position:relative;width:var(--size);aspect-ratio:1;
    margin-bottom:calc(var(--size) * -.26);
    -webkit-mask-image:linear-gradient(to bottom,#000 38%,transparent 70%);
            mask-image:linear-gradient(to bottom,#000 38%,transparent 70%);
    opacity:.7;
  }
  .eclipse::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(closest-side circle at 50% 44%, rgba(91,75,255,.4) 0%, rgba(91,75,255,.1) 55%, transparent 100%);
    filter:blur(8px);
  }
  .planet{
    position:absolute;inset:18%;border-radius:50%;
    background:radial-gradient(circle at 50% 0%, #26274A 0%, #121329 34%, #06070F 70%);
    box-shadow:inset 0 2px 0 rgba(160,150,255,.8), 0 -8px 30px -8px rgba(91,75,255,.6);
  }
  h1{
    font-weight:300;font-size:clamp(2.4rem,8vw,3.6rem);
    letter-spacing:.4em;margin-right:-.4em;
  }
  p{
    margin-top:14px;font-weight:500;text-transform:uppercase;color:var(--indigo-soft);
    font-size:.74rem;letter-spacing:.5em;margin-right:-.5em;
  }
  a{
    margin-top:clamp(40px,8vh,72px);
    color:var(--t-mut);text-decoration:none;text-transform:uppercase;
    font-size:.72rem;letter-spacing:.3em;margin-right:-.3em;padding:6px 2px;
    transition:color .25s;
  }
  a:hover,a:focus-visible{color:var(--t-hi)}
  a:focus-visible{outline:1px solid var(--indigo-soft);outline-offset:4px;border-radius:2px}
</style>
</head>
<body>
  <main>
    <div class="eclipse" aria-hidden="true"><div class="planet"></div></div>
    <h1>404</h1>
    <p>Page not found</p>
    <a href="/">← Back to mahdiyar.me</a>
  </main>
</body>
</html>
