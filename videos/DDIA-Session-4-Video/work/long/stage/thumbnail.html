<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1280px; height: 720px; background: var(--bg); }
  .t { position: absolute; inset: 0; overflow: hidden; background:
    radial-gradient(900px 600px at 18% 30%, rgba(255,162,77,.12), transparent 60%),
    radial-gradient(700px 500px at 80% 85%, rgba(79,209,188,.10), transparent 60%), var(--bg); }
  .kicker { position: absolute; left: 64px; top: 58px; font-size: 30px; font-weight: 750; letter-spacing: .02em; color: var(--hl); }
  h1 { position: absolute; left: 60px; top: 116px; margin: 0; font-size: 150px; line-height: .92; font-weight: 800; letter-spacing: -.045em; }
  h1 span { display: block; }
  .sub { position: absolute; left: 66px; top: 586px; font-size: 38px; font-weight: 650; color: var(--ink); letter-spacing: -.01em; }
  .sub b { color: var(--hl); }
  .grid { position: absolute; right: 70px; top: 120px; display: grid; grid-template-columns: repeat(6, 62px); gap: 10px; }
  .grid div { height: 38px; border-radius: 8px; background: rgba(255,255,255,.08); }
  .grid div.on { background: var(--orange); box-shadow: 0 0 22px rgba(255,162,77,.45); }
  .lbl { position: absolute; right: 70px; top: 616px; width: 422px; text-align: center; font-size: 28px; font-weight: 700; color: var(--orange); }
</style>
</head>
<body>
<div class="t">
  <div class="kicker">DDIA · CHAPTER 3, PART 2</div>
  <h1><span style="color:var(--ink)">Rows</span><span style="color:var(--dim, #8a97ad);font-size:.55em;letter-spacing:-.02em">vs.</span><span style="color:var(--orange)">Columns</span></h1>
  <div class="sub">Why one report can slow down <b>checkout</b></div>
  <div class="grid" id="g"></div>
</div>
<script>
  const g = document.getElementById('g');
  for (let r = 0; r < 10; r++) for (let c = 0; c < 6; c++) {
    const d = document.createElement('div'); if (c === 3 || c === 5) d.className = 'on'; g.appendChild(d);
  }
</script>
</body>
</html>
